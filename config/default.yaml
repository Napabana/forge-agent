llm:
  provider: openai
  protocol: responses
  model: gpt-5.6-terra
  api_key: ${KRILL_API_KEY}
  base_url: https://api-slb.krill-ai.net/coding/v1
  max_tokens: 1024

agent:
  max_steps: 40
  budget_tokens: 80000
  log_dir: ./logs

tools:
  shell:
    timeout: 30 # 秒
    max_output_tokens: 8000 # 截断长度
  file:
    max_view_lines: 100 # view 命令每次显示行数

context:
  repo_map_budget: 8000 # repo-map 最大 token 数
  history_window: 20 # 保留最近 N 轮对话
