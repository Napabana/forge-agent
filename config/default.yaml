agent:
  max_steps: 40
  planning_mode: off # off | auto | always；默认保持 baseline ReAct
  context_budget_cap: 384000
  context_safety_margin_tokens: 40000
  log_dir: ./logs

tools:
  shell:
    timeout: 30 # 秒
    max_output_tokens: 10000 # 截断长度
  file:
    max_view_lines: 100 # view 命令每次显示行数

context:
  repo_map_budget: 12000 # repo-map 最大 token 数
  history_window: 20 # 保留最近 N 轮对话
