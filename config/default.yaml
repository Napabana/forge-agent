#可以的
llm:
  provider: openai
  model: deepseek-v4.1-flash
  api_key: ${KRILL_API_KEY}
  base_url: https://api.krill-code.net/coding/v1 
  #https://api-slb.krill-ai.net/coding/v1
  context_window: 1000000
  model_max_output_tokens: 384000

  # Forge 这一次请求真正允许模型生成多少
  max_output_tokens: 50000

