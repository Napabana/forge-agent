[project]
site_name = "Forge Agent — Architecture & Implementation"
site_description = "基于当前源码核查的 Forge Agent 架构、实现流程、源码索引与设计证据。"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = false
extra_css = ["stylesheets/extra.css"]
nav = [
  { "首页" = "README.md" },
  { "当前功能" = [{ "整体架构" = "design/architecture.md" }, { "任务执行" = "design/execution.md" }, { "Agent 与工具执行" = "design/agent-tools.md" }, { "上下文与仓库导航" = "design/context.md" }, { "计划与执行恢复" = "design/planning-recovery.md" }, { "Skills 与 MCP" = "design/extensions.md" }, { "隔离、验收与 GitHub 交付" = "design/isolation-acceptance.md" }, { "评测与经验迭代" = "design/evaluation.md" }, { "Supervisor 与 Worker" = "design/workers.md" }, { "项目记忆" = "design/project-memory.md" }, { "长时运行与恢复" = "design/durable-runtime.md" }, { "配置、模型与用量" = "design/configuration.md" }] },
  { "源码索引" = "design/source-index.md" },
  { "源码阅读路线" = "source-navigation.md" },
  { "命令查阅" = "reference.md" },
  { "项目状态" = "PROJECT_STATE.md" },
  { "文档维护" = "design/MAINTENANCE.md" },
]

[project.theme]
language = "zh"
font = false
features = [
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "切换到暗色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "切换到亮色模式"

[project.markdown_extensions]
attr_list = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.offline]

[project.plugins.exclude]
glob = ["changes/**", "evidence/**", "plans/**", "research/**", "todo/**"]

[project.extra]
polyfills = ["javascripts/iframe-worker-shim.js"]
