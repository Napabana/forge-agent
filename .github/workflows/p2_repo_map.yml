name: P2 Repo Map final evidence

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply final Repo Map runner fix
        run: python scripts/p2_repo_map_finalize_transform.py
      - name: Targeted Repo Map tests
        run: |
          pytest -q tests/test_repo_map_improvements.py
          pytest -q tests/test_repo_map_ablation.py
          pytest -q tests/test_repo_map_persistent.py tests/test_repo_map_prompt_layout.py
          pytest -q tests/test_repo_map_product_behavior.py
          pytest -q tests/test_repo_map_agent_ablation.py
          pytest -q tests/test_repo_map_persistent_benchmark.py
      - name: Full pytest
        run: pytest -q
      - name: Commit validated runner fix locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- agent/runner.py; then
            echo 'Runner fix already committed'
          else
            git add agent/runner.py
            git commit -m 'fix: reuse persistent Repo Map at chat boundary'
          fi
      - name: Run persistent Repo Map benchmark
        run: |
          python -m evals.repo_map_persistent_benchmark \
            --repo . \
            --output evals/results/repo_map_persistent_benchmark \
            --repetitions 5 \
            --strict
      - name: Record real-agent harness status
        run: |
          python -m evals.repo_map_agent_ablation \
            --validate-only \
            --output evals/results/repo_map_agent_ablation \
            --reason provider_credentials_not_available_in_ci
      - name: Commit P2 offline evidence
        shell: bash
        run: |
          git add evals/results/repo_map_persistent_benchmark
          git add evals/results/repo_map_agent_ablation
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit'
          else
            git commit -m 'bench: record P2 Repo Map offline evidence'
          fi
          git push origin HEAD:dev
