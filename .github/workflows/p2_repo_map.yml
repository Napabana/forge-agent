name: P2 Repo Map validation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply P2 Repo Map core wiring once
        shell: bash
        run: |
          if grep -q 'from context.incremental_repo_map import PersistentRepoMap' agent/core.py; then
            echo 'P2 core wiring already applied'
          else
            python scripts/p2_repo_map_transform.py
          fi
      - name: Targeted Repo Map tests
        run: |
          pytest -q tests/test_repo_map_improvements.py
          pytest -q tests/test_repo_map_ablation.py
          pytest -q tests/test_repo_map_persistent.py tests/test_repo_map_prompt_layout.py
      - name: Full pytest
        run: pytest -q
      - name: Commit generated core wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated wiring changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/core.py agent/runner.py agent/prompt.py tests/test_repo_map_improvements.py
          git commit -m 'feat: wire persistent incremental Repo Map'
          git push origin HEAD:dev
